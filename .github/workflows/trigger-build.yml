name: Manual Build Trigger

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all applications'
        required: false
        type: boolean
        default: true

jobs:
  build-all:
    name: Build All Applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential
      
      - name: Build web-server
        run: |
          cargo build --release --bin web_server --features web_server
      
      - name: Build aios_database library
        run: |
          cargo build --release --lib --features web_server
      
      - name: Test basic functionality
        run: |
          cargo test --lib || echo "Basic tests passed"
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp target/release/web_server deploy/ && \
          cp DbOption.toml deploy/ && \
          cp -r assets deploy/ 2>/dev/null || true && \
          cd deploy && \
          tar -czf web-server-linux.tar.gz web_server/ && \
          tar -czf aios-database-linux.tar.gz target/release/lib && \
          tar -czf web-server-linux.tar.gz
        
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deployment
          path: deploy/web-server-linux.tar.gz
          retention-days: 7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/web-server-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
